<script>
window.addEventListener('message', function(event) {
    if (event.data.covidTheme) {
        const theme = event.data.covidTheme;
        const isDark = theme === 'dark';
        const TEXT = isDark ? '#F0EEFF' : '#1A1A2E';
        const GRID = isDark ? 'rgba(255,255,255,0.15)' : '#CFC7DD';
        const update = {
            'font.color': TEXT,
            'title.font.color': TEXT,
            'hoverlabel.bgcolor': isDark ? 'rgba(30,30,50,0.9)' : 'rgba(255,255,255,0.9)',
            'hoverlabel.font.color': TEXT,
            'hoverlabel.bordercolor': GRID,
        };
        for (let i = 1; i <= 6; i++) {
            const xi = i === 1 ? 'xaxis' : 'xaxis' + i;
            update[xi + '.gridcolor'] = GRID;
            update[xi + '.linecolor'] = GRID;
            update[xi + '.tickfont.color'] = TEXT;
            update[xi + '.spikecolor'] = GRID;
        }
        for (let i = 1; i <= 9; i++) {
            const yi = i === 1 ? 'yaxis' : 'yaxis' + i;
            update[yi + '.gridcolor'] = GRID;
            update[yi + '.linecolor'] = GRID;
            update[yi + '.tickfont.color'] = TEXT;
            if ([1, 6, 7].includes(i)) update[yi + '.title.font.color'] = TEXT;
        }
        update['xaxis5.rangeselector.bgcolor'] = GRID;
        update['xaxis5.rangeselector.font.color'] = TEXT;
        const gd = document.getElementsByClassName('plotly-graph-div')[0];
        Plotly.relayout(gd, update);
    }
});
</script>
