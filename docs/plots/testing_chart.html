<script>
window.addEventListener('message', function(e) {
  if (!e.data || !e.data.covidTheme) return;
  const dark = e.data.covidTheme === 'dark';
  const TEXT = dark ? '#f0eeff' : '#1A1A2E';
  const GRID = dark ? 'rgba(255,255,255,0.10)' : '#CFC7DD';
  const gd = document.querySelector('.plotly-graph-div');
  if (!gd) return;
  const upd = {
    'font.color': TEXT, 'title.font.color': TEXT,
    'hoverlabel.bgcolor': dark ? 'rgba(20,16,40,0.9)' : 'rgba(255,255,255,0.9)',
    'hoverlabel.font.color': TEXT, 'hoverlabel.bordercolor': GRID,
  };
  for (let i = 1; i <= 6; i++) {
    const x = i === 1 ? 'xaxis' : 'xaxis' + i;
    upd[x+'.gridcolor'] = GRID; upd[x+'.linecolor'] = GRID;
    upd[x+'.tickfont.color'] = TEXT; upd[x+'.spikecolor'] = GRID;
  }
  for (let i = 1; i <= 6; i++) {
    const y = i === 1 ? 'yaxis' : 'yaxis' + i;
    upd[y+'.gridcolor'] = GRID; upd[y+'.linecolor'] = GRID;
    upd[y+'.tickfont.color'] = TEXT;
    if (i === 1 || i === 4) upd[y+'.title.font.color'] = TEXT;
  }
  upd['xaxis5.rangeselector.bgcolor'] = GRID;
  upd['xaxis5.rangeselector.font.color'] = TEXT;
  for (let i = 0; i < 3; i++) upd['annotations['+i+'].font.color'] = TEXT;
  Plotly.relayout(gd, upd);
});
document.addEventListener('DOMContentLoaded', function() {
  try {
    var t = window.parent.document.documentElement.getAttribute('data-theme');
    if (t) window.dispatchEvent(new MessageEvent('message', {data:{covidTheme:t}}));
  } catch(e) {}
});
</script>
